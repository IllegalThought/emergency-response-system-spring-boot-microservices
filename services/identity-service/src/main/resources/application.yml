server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/identity_db}
    username: ${DB_USERNAME:campus_admin}
    password: ${DB_PASSWORD:campus_password}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      "hibernate.jdbc.time_zone": UTC

  flyway:
    enabled: true
    locations: classpath:db/migration


# JWT configuration
security:
  jwt:
    issuer: campus-naksha-identity
    access-token-ttl: PT15M
    secret: ${JWT_SECRET:Y2FtcHVzLW5ha3NoYS1kZXYtc2VjcmV0LWtleS0zMmJ5dGVzIQ==}


# Eureka configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always